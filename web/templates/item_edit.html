{% extends "base.html" %}

{% block title %}Edit {{ item.name|capitalize }} — Sollunga{% endblock %}

{% block content %}
<article style="max-width: 580px; margin: 1rem auto; padding: 2rem;">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
    <h3 style="margin-bottom: 0;">✏️ Edit Item: {{ item.name|capitalize }}</h3>
    <a href="/items" role="button" class="outline btn-sm">Back</a>
  </div>

  <form method="POST" action="/items/edit/{{ item.id }}">
    <div class="grid">
      <label for="price">
        Price per unit (₹)
        <input type="number" step="0.01" min="0.01" id="price" name="price" value="{{ item.price }}" required>
      </label>
      <label for="stock">
        Available Stock
        <input type="number" step="any" min="0" id="stock" name="stock" value="{{ item.stock }}" required>
      </label>
    </div>

    <div class="grid">
      <label for="unit">
        Unit
        <input type="text" id="unit" name="unit" value="{{ item.unit }}" required>
      </label>
    </div>

    <label for="aliases">
      Aliases / Synonyms (comma-separated)
      <input type="text" id="aliases" name="aliases" value="{{ item.aliases|join(', ') }}">
      <small style="color: var(--pico-muted-color);">Customer keyword variations (Tamil/Tanglish/English)</small>
    </label>

    <button type="submit" style="margin-top: 1rem; width: 100%;">Save Changes</button>
  </form>
</article>
{% endblock %}
