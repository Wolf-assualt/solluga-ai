{% extends "base.html" %}

{% block title %}Login — Sollunga Dashboard{% endblock %}

{% block content %}
<div class="card" style="padding: 2.25rem 2rem; border-radius: 20px; box-shadow: var(--shadow-lg); margin-bottom: 0;">
  <div style="text-align: center; margin-bottom: 1.75rem;">
    <svg viewBox="0 0 64 64" width="56" height="56" role="img" aria-label="Sollunga"
         style="margin: 0 auto 1rem; display:block; border-radius:16px; box-shadow:0 12px 28px -10px rgba(99,102,241,.85);">
      <defs><linearGradient id="sollungaLoginGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs>
      <rect width="64" height="64" rx="15" fill="url(#sollungaLoginGrad)"/>
      <path d="M13 16h38a3 3 0 0 1 3 3v6a2 2 0 0 1-2 2H12a2 2 0 0 1-2-2v-6a3 3 0 0 1 3-3z" fill="#fff"/>
      <path d="M16 27h32v21a3 3 0 0 1-3 3H19a3 3 0 0 1-3-3V27z" fill="#fff" opacity=".92"/>
      <path d="M27 37h10v14h-8a2 2 0 0 1-2-2z" fill="#6d5cf0"/>
      <rect x="20" y="31" width="7" height="6" rx="1.5" fill="#6d5cf0" opacity=".5"/>
      <rect x="37" y="31" width="7" height="6" rx="1.5" fill="#6d5cf0" opacity=".5"/>
    </svg>
    <h2 style="margin: 0 0 .25rem; font-weight: 800;">Sollunga</h2>
    <p class="muted" style="margin: 0; font-size: .9rem;">Shop Owner Dashboard</p>
  </div>

  <form method="POST" action="/login">
    <label for="password">
      Owner Password
      <input
        type="password"
        id="password"
        name="password"
        placeholder="Enter dashboard password"
        required
        autofocus
      />
    </label>

    <button type="submit" style="width: 100%; margin-top: 1rem;">
      <i class="fa-solid fa-right-to-bracket"></i> Sign In
    </button>
  </form>

  <div class="divider"></div>
  <p class="muted" style="text-align: center; font-size: .8rem; margin: 0;">
    <i class="fa-solid fa-shield-halved"></i> Secure access for shop owners only
  </p>
</div>
{% endblock %}
